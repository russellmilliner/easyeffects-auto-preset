name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Test (Rust & Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Format, Clippy, Test & Build
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --verbose
          cargo build --release --verbose

      - name: Install Python Test Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt6 python3-pytest libegl1 libxkbcommon0

      - name: Python Syntax & Unit Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -m py_compile python/easyeffects_auto_preset.py
          pytest -v tests
