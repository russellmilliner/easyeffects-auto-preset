app-id: io.github.russellmilliner.easyeffects_auto_preset
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: easyeffects-auto-preset-gui
finish-args:
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.Flatpak
  - --filesystem=xdg-config/easyeffects-auto-preset:create
  - --filesystem=xdg-data/easyeffects:create
  - --filesystem=~/.var/app/com.github.wwmm.easyeffects:create

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/easyeffects-auto-preset/cargo

modules:
  - name: python3-pyqt6
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links=file://${PWD} --prefix=/app --no-deps --no-build-isolation PyQt6_sip PyQt6
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/71/e5/aaaa629a17f5abd9d6f80d5bd8cbbc8b91434f017d03eb5df7d4258ecb41/pyqt6_sip-13.13.0-cp313-cp313-manylinux1_x86_64.manylinux_2_5_x86_64.whl
        sha256: c42dcf3fa0b8bb9985423850971064323a3a4aa97efdc3fa69161b37088d795c
      - type: file
        url: https://files.pythonhosted.org/packages/c3/a0/bd1399740dfa80c0a94d20b02d89962a31458233dcf70eaa09bfbccf3d0f/pyqt6-6.11.0-cp310-abi3-manylinux_2_34_x86_64.whl
        sha256: 8555277989fa7d114cb3c3443fd261d566909f7268ceedd41d93a5f02d37ec05

  - name: easyeffects-auto-preset
    buildsystem: simple
    build-commands:
      # Build native Rust binary
      - cargo build --release --verbose
      - install -Dm755 target/release/easyeffects-auto-preset /app/bin/easyeffects-auto-preset-daemon

      # Install GUI launcher script under both standard binary names
      - install -Dm755 python/easyeffects_auto_preset.py /app/bin/easyeffects-auto-preset-gui
      - install -Dm755 python/easyeffects_auto_preset.py /app/bin/easyeffects-auto-preset
      
      # Install Desktop, Metainfo, and Icons
      - install -Dm644 data/io.github.russellmilliner.easyeffects_auto_preset.desktop -t /app/share/applications/
      - install -Dm644 data/io.github.russellmilliner.easyeffects_auto_preset.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 data/icons/io.github.russellmilliner.easyeffects_auto_preset.png /app/share/icons/hicolor/128x128/apps/io.github.russellmilliner.easyeffects_auto_preset.png
      
      # Install License
      - install -Dm644 LICENSE NOTICE -t /app/share/licenses/io.github.russellmilliner.easyeffects_auto_preset/
      
      # Install Presets
      - install -d /app/share/easyeffects-auto-preset/presets/
      - install -m644 presets/*.json -t /app/share/easyeffects-auto-preset/presets/
    sources:
      - type: dir
        path: .
