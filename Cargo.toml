[package]
name = "easyeffects-auto-preset"
version = "0.5.0"
edition = "2021"
authors = ["Russell Milliner <russell.milliner@gmail.com>"]
description = "Automated EasyEffects preset switcher for Voice Meetings, YouTube, Music, Movies, and Video on Linux (PipeWire / KDE Plasma)"
license = "Apache-2.0"
repository = "https://github.com/russellmilliner/easyeffects-auto-preset"
keywords = ["easyeffects", "audio", "pipewire", "pulseaudio", "preset-switcher"]
categories = ["multimedia::audio", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
